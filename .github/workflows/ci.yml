name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Two Go versions on purpose. A bug in scripts/ensure-binary.sh
    # (`go build -o X` onto a pre-existing non-object file) was invisible
    # on the single pinned 1.25 toolchain this job used to run, and only
    # failed on Go >= 1.26, where the toolchain refuses that build. "1.25"
    # is the floor the plugin promises; "stable" is whatever users who
    # just installed Go actually have.
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25", "stable"]

    # Only the postgres/... package needs this — every other package's
    # tests are pure logic or a temp-file SQLite db (see README's Testing
    # section). No `claude` CLI or Ollama needed anywhere in this suite;
    # those are verified by hand against the real thing, documented in the
    # project history, not run in CI.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: claudemem
          POSTGRES_PASSWORD: claudemem
          POSTGRES_DB: claudemem_ci_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U claudemem -d claudemem_ci_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build -o claude-mem-go ./cmd/claude-mem-go

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Format check
        run: |
          diff="$(gofmt -l .)"
          if [ -n "$diff" ]; then
            echo "gofmt found unformatted files:"
            echo "$diff"
            exit 1
          fi

      - name: Test
        run: go test ./... -race -v
        env:
          # Deliberately NOT named `claudemem`, the name the README uses for a
          # real store: these tests wipe and rewrite whatever they are pointed
          # at, so the database name itself should make it obvious at a glance
          # that this is disposable.
          CLAUDE_MEM_GO_TEST_POSTGRES_DSN: postgres://claudemem:claudemem@localhost:55432/claudemem_ci_test?sslmode=disable

      - name: Validate plugin manifest
        # No fallback/skip on install failure: a silently-skipped validation
        # step reads as "the manifest is fine" when it never actually
        # checked anything. Verified locally (a stock node:20-slim
        # container, matching what a hosted Ubuntu runner has) that this
        # installs and passes cleanly before removing the old
        # `command -v claude || echo skipping` escape hatch that let this
        # step silently no-op for as long as it existed.
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .

      - name: Validate MCPB manifest
        # Schema validation only, via the upstream tool — the actual
        # .mcpb bytes are built deterministically by
        # scripts/build-mcpb instead (see that tool's own comment for
        # why: @anthropic-ai/mcpb's own `pack` stamps every zip entry
        # with time.Now(), which isn't reproducible). This step only
        # catches manifest.json itself drifting out of schema.
        run: |
          npm install -g @anthropic-ai/mcpb
          mcpb validate manifest.json

  reproducible-build:
    runs-on: ubuntu-latest

    # Proves the .goreleaser.yaml reproducibility settings (mod_timestamp,
    # -trimpath, -buildvcs=true, archives[].builds_info.mtime, and each
    # files: entry's own info.mtime) actually hold, rather than trusting
    # them by inspection: two independent snapshot builds of the same
    # commit, checksums that must match byte-for-byte. This is the real
    # evidence behind release.yml's build/verify/publish split — if this
    # job goes red, the independent rebuild that gates publishing there
    # can never match either, and release.yml fails closed rather than
    # publishing something unreproducible.
    #
    # Also proves the same property for the .mcpb bundle
    # scripts/build-mcpb-stage.sh/scripts/build-mcpb assemble on top of
    # these archives — it's a second, independently-reproducible artifact
    # built from the same commit, not just the tar.gz archives.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      # -buildvcs=true (pinned in .goreleaser.yaml) embeds vcs.modified
      # based on whether `git status --porcelain` is non-empty at build
      # time — untracked files count, not just tracked changes. This step
      # runs before *every* build in this job (not just the first) so a
      # leftover untracked dir from a prior step in this same job — or a
      # future edit to this workflow that reintroduces one — fails loudly
      # here instead of silently flipping one build's vcs.modified bit and
      # producing a checksum mismatch that has nothing to do with the
      # actual reproducibility settings under test.
      - name: Assert clean working tree before build #1
        run: |
          set -eu
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree is not clean before build #1 — this would make -buildvcs=true embed vcs.modified=true and break the byte-for-byte comparison below" >&2
            git status --porcelain >&2
            exit 1
          fi

      - name: Build snapshot #1
        run: goreleaser release --clean --snapshot

      - name: Stage and build the MCPB bundle #1
        run: scripts/build-mcpb-stage.sh snapshot

      # Moved to $RUNNER_TEMP, outside the checkout, rather than
      # `mv dist dist-1`: a sibling directory inside the checkout is
      # untracked and not covered by .gitignore (only dist/ itself is), so
      # it would make `git status --porcelain` non-empty for build #2 and
      # build #2 alone — the two builds would then differ only in their
      # embedded vcs.modified bit, not in anything .goreleaser.yaml
      # actually controls. release.yml's build/verify jobs don't hit this
      # because each runs in its own fresh checkout; this job proves the
      # same reproducibility within a single job, so it has to clear its
      # own output out of the tree between builds instead.
      - run: mv dist "$RUNNER_TEMP/dist-1"

      - name: Assert clean working tree before build #2
        run: |
          set -eu
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree is not clean before build #2 — this would make -buildvcs=true embed vcs.modified=true and break the byte-for-byte comparison below" >&2
            git status --porcelain >&2
            exit 1
          fi

      - name: Build snapshot #2
        run: goreleaser release --clean --snapshot

      - name: Stage and build the MCPB bundle #2
        run: scripts/build-mcpb-stage.sh snapshot

      - run: mv dist "$RUNNER_TEMP/dist-2"

      - name: Diff archive listings and checksums
        run: |
          set -eu
          dist1="$RUNNER_TEMP/dist-1"
          dist2="$RUNNER_TEMP/dist-2"
          echo "--- build 1 checksums ---"
          cat "$dist1/checksums.txt"
          echo "--- build 2 checksums ---"
          cat "$dist2/checksums.txt"

          # Diff every archive's tar listing (name, mode, owner, size,
          # mtime per entry) up front, not only after a checksum mismatch:
          # if these two builds ever diverge again, this says *where* —
          # which archive, which entry, which field — instead of just
          # "the checksums differ." Caught two real bugs this way already:
          # builds_info.mtime only pinned the binary's own tar entry, and
          # the extra `files:` entries (README.md, CHANGELOG.md, LICENSE)
          # kept the build-time mtime until they got their own per-entry
          # info.mtime too (see .goreleaser.yaml); and dist-1/ sitting
          # untracked inside the checkout flipped build #2's embedded
          # vcs.modified bit, which showed up only in the checksums, never
          # in these tar listings, since it lives inside the binary's own
          # bytes rather than any entry's metadata — hence the two
          # "assert clean working tree" steps above.
          status=0
          for f in "$dist1"/*.tar.gz; do
            name="$(basename "$f")"
            echo "=== $name ==="
            if ! diff -u <(tar -tvzf "$dist1/$name") <(tar -tvzf "$dist2/$name"); then
              status=1
            fi
          done

          # Same check for the .mcpb bundle (scripts/build-mcpb-stage.sh,
          # scripts/build-mcpb) — cd'd into each dir first so unzip's own
          # "Archive:" header line (which echoes the path it was given)
          # doesn't make dist-1/x.mcpb and dist-2/x.mcpb diff on that
          # line alone regardless of the two zips' actual contents.
          for f in "$dist1"/*.mcpb; do
            name="$(basename "$f")"
            echo "=== $name ==="
            if ! diff -u <(cd "$dist1" && unzip -v "$name") <(cd "$dist2" && unzip -v "$name"); then
              status=1
            fi
          done

          if ! diff -u "$dist1/checksums.txt" "$dist2/checksums.txt"; then
            status=1
          fi

          if [ "$status" -ne 0 ]; then
            echo "::error::build 1 and build 2 are not byte-identical. If every tar/zip listing above is identical but the checksums still differ, the divergence is in a container format's own header (gzip's embedded MTIME field for the archives, or the zip local/central-directory header's own timestamp field for the .mcpb — both separate from the entries' own per-file mtimes) — check that next, e.g. with 'gzip -l' or a hexdump of each file's first bytes." >&2
            exit 1
          fi
          echo "reproducible: two independent builds produced identical archives and .mcpb bundle (tar/zip listings and checksums all match)"

  test-macos:
    runs-on: macos-latest

    # A dedicated macOS job, separate from the ubuntu-latest matrix above:
    # this project ships darwin release binaries but, until now, never ran
    # its own test suite on darwin. That gap was real, not theoretical — a
    # class of unix-domain-socket tests bound their listener under
    # t.TempDir(), whose path embeds the test name under $TMPDIR, and macOS
    # sets $TMPDIR to an already-long per-process path; add the test name
    # and the combination routinely exceeds sockaddr_un's ~104-byte
    # sun_path limit, failing net.Listen with "bind: invalid argument" —
    # invisible on ubuntu-latest, where $TMPDIR is short.
    #
    # No postgres service: GitHub-hosted `services:` containers only run
    # on Linux runners. internal/memory/postgres's tests already skip
    # themselves without CLAUDE_MEM_GO_TEST_POSTGRES_DSN (see the ubuntu
    # job and the README's Testing section), so that package is a no-op
    # skip here rather than a gap. Everything else — including the
    # socket-bound packages this job exists for — runs for real.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        run: go build -o claude-mem-go ./cmd/claude-mem-go

      - name: Test
        run: go test ./... -race -v
