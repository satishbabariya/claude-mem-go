name: Release

# vX.Y.Z tags only — pushing every commit through this would create a
# GitHub Release on every push, which is not what a tag-triggered release
# workflow is for. CI (ci.yml) already builds/tests every push; this
# workflow's only job is turning a deliberately-tagged commit into real
# downloadable binaries.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser's changelog step is disabled (see .goreleaser.yaml),
          # but full history is what makes `vcs.revision`/`vcs.time` (which
          # `version`/`doctor` print, via runtime/debug.ReadBuildInfo)
          # resolve correctly rather than however a shallow clone's HEAD
          # happens to look.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          # Reads the `toolchain go1.25.N` line in go.mod, not a floating
          # "1.25". The pin-release-checksums workflow (which computed
          # this tag's committed checksum pin) resolves its Go toolchain
          # the same way — same source, same version, on purpose. If the
          # two ever resolved different patch versions, identical source
          # would produce different bytes and this workflow's verify step
          # below would fail every release until they were realigned.
          go-version-file: go.mod

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      # Build first, skip only the GitHub-release-publish step, so nothing
      # reaches the public Release until it has been checked against the
      # committed pin below. `goreleaser continue` (reusing this build's
      # dist/ for the real publish step, skipping a full rebuild) is not
      # available in the pinned goreleaser version — we rebuild instead of
      # reusing this run's artifacts, and reproducibility is exactly what
      # makes that safe: a second `--clean` build of the same tagged
      # commit is required to produce byte-identical output, so rebuilding
      # to publish is not a second chance to get a different, unverified
      # answer.
      - name: Build (without publishing)
        run: goreleaser release --clean --skip=publish

      - name: Verify against the committed checksum pin
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          pin="scripts/checksums/$version.txt"
          if [ ! -f "$pin" ]; then
            echo "::error::no committed checksum pin at $pin for tag $GITHUB_REF_NAME." >&2
            echo "::error::Run the 'Pin release checksums' workflow (see scripts/checksums/README.md) against the commit this tag points at, merge the PR it opens, then re-push this tag. Refusing to publish an unpinned release." >&2
            exit 1
          fi
          manifest_version="$(jq -r .version .claude-plugin/plugin.json)"
          if [ "$manifest_version" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match .claude-plugin/plugin.json's version ($manifest_version) at this commit. Refusing to publish a release under a mismatched version." >&2
            exit 1
          fi
          if ! diff -u "$pin" dist/checksums.txt; then
            echo "::error::build output does not match the committed checksum pin at $pin. Either the release build is not reproducible (see the 'reproducible-build' CI job) or the pin is stale. Refusing to publish." >&2
            exit 1
          fi
          echo "checksums verified byte-for-byte against $pin"

      - name: Publish
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
