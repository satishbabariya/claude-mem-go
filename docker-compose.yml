services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: claudemem
      POSTGRES_PASSWORD: claudemem
      POSTGRES_DB: claudemem
    ports:
      - "55432:5432"
    volumes:
      - claude_mem_go_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claudemem -d claudemem"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  claude_mem_go_pgdata:
