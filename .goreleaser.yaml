# Real binary releases — this project had none before: installing meant
# `go build` locally, then pointing the plugin at that binary by hand (see
# README's "Development" section). Every push already builds and tests via
# .github/workflows/ci.yml; this is the same binary, cross-compiled for
# every platform Claude Code actually runs on, attached to a GitHub Release
# on every `vX.Y.Z` tag push (.github/workflows/release.yml).
#
# Deliberately NOT wired into the plugin's hooks.json yet — that still
# points at "$CLAUDE_PLUGIN_ROOT/claude-mem-go" (a locally-built binary),
# and switching it to fetch a matching release asset is a real, separate
# change (a Setup-hook download-if-missing step, the same shape real
# claude-mem's own Setup hook covers) that deserves its own verification
# pass rather than riding along with "does goreleaser produce working
# binaries at all."
version: 2

project_name: claude-mem-go

before:
  hooks:
    # Verify, never modify: a hook that rewrites go.mod/go.sum on the
    # runner would make the checkout dirty, and Go's VCS stamp (what
    # `claude-mem-go version` prints) would then say "-dirty" for a
    # release built from a clean tag. dist/ is gitignored for the same
    # reason — untracked files count as dirty too.
    - go mod tidy -diff

builds:
  - id: claude-mem-go
    main: ./cmd/claude-mem-go
    binary: claude-mem-go
    # CGO_ENABLED=0 is a real constraint, not a default left in place:
    # modernc.org/sqlite is pure Go (this project's whole reason for using
    # it over mattn/go-sqlite3 — see internal/memory/sqlite's doc comments), and pgx/v5 is a
    # pure Go Postgres driver too. Nothing here needs cgo, so a static
    # binary that cross-compiles cleanly without a C toolchain per target
    # is a correctness property of the dependency choices, not a shortcut.
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      # -trimpath: the builder's absolute filesystem path (which differs
      # between release.yml's build and verify jobs — two independent
      # runners by design, see that workflow's own comments — and between
      # anyone reproducing the build locally) must not leak into the
      # binary, or the two jobs' otherwise-identical output would diverge
      # on that alone.
      #
      # -buildvcs=true pinned explicitly, not left on Go's default `auto`:
      # `auto` silently drops VCS stamping when the working tree isn't a
      # clean git checkout (a shallow clone missing objects, a dirty
      # tree), which would silently change the binary's bytes with no
      # error. Pinning `true` turns that into a hard build failure
      # instead — the same "fail loud, not quiet" principle as the
      # `go mod tidy -diff` hook above.
      - -trimpath
      - -buildvcs=true
    # Build time otherwise leaks into the binary — goreleaser's default is
    # wall-clock "now", which is why identical source currently produces
    # different bytes on every invocation. Pinning it to the commit that
    # is actually being built is what makes a rebuild of the same commit,
    # by a different job or a different person, byte-for-byte identical.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      # -s -w strips debug info/symbol tables (smaller binaries; this isn't
      # a debug build). Deliberately does NOT set -X for version info —
      # buildVersionString (cmd/claude-mem-go/version.go) reads Go's own
      # runtime/debug.ReadBuildInfo() vcs.* settings instead, which survive
      # a normal `go build` inside a git checkout without any ldflags
      # wiring at all, cross-compiled or not.
      - -s -w

archives:
  - id: claude-mem-go
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # Reproducibility is over the archive, not just the binary inside it:
    # goreleaser stamps archive file mtimes with the build time by
    # default, so identical binaries would still produce different
    # archive bytes (and therefore different checksums.txt entries) on
    # every rebuild without this.
    #
    # `builds_info.mtime` below only pins the *binary's* entry (the one
    # `builds:` produces) — confirmed the hard way, by a `reproducible-
    # build` CI run whose two builds' checksums differed even with that
    # setting in place. The three extra files still got the build-time
    # mtime because they go through `files:`, a separate mechanism with
    # its own per-entry `info.mtime`. Both have to be set; either alone
    # leaves part of the archive unpinned.
    files:
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: CHANGELOG.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
    builds_info:
      mtime: "{{ .CommitDate }}"

checksum:
  name_template: "checksums.txt"

# Real release notes come from CHANGELOG.md (hand-written, "what actually
# changed and why" — see its own header comment), not an auto-generated
# commit-message dump; disabling goreleaser's own changelog generation
# avoids ending up with two competing, inconsistent versions of "what
# changed."
changelog:
  disable: true
